  encoders: 
    -ALL:
      model_type: tempcnn
      dropout: 0.2
      kernel_size: 3 #default value: 5
      layer_size: 64 #default value: 128
      n_layers: 4 #default value: 3
      seq_len: 15
      use_norm: False
  predictive_model:
    model_type: linear

    use_norm_last: True
