output_dir_folder: path to storage results
input_dir_folder: path to input data
additional_method_name: -CoMissRand

load_memory: True
data_name: opport_HL_train

method: 
  agg_args:
    mode: avg
    #mode: concat
    #adaptive: True
    #feature: False #it can also be per feature

training: 
  return_rep: False
  parallel_processes: 2 #this value will divide the total number of cpus to calcualte num_workers
  max_epochs: 1000
  batch_size: 256
  emb_dim: 128 
  monitor_metric: f1we_avg
  early_stop_args: 
    min_delta: 0.001
    mode: max
    patience: 5
    verbose: True

  missing_as_aug: True
  missing_method:
    missing_random: True
    name: I #just for naming

  additional_args:
    weights_loss: 
      #fused-prediction
      main_pred: 1 #full view prediction
      
      #co-learning feature
      shared: [ contrastive_vol, 1]
      specific: [ modality_disc, 1 ] 
      contrastive_temp: 0.07
      
      #co-learning decision
      decision: [ mutual_distillation, 1]
      distillation_temp: 0.5
      distillation_weight: 1.0  #inside the computation it already calculates temp**2
      
    optimizer: adamw
    lr: 0.001
    
experiment: 
  runs_seed: [10, 5, 5123] #repetitions
  preprocess: 
    fillnan: True
    flatten: False
    form: zscore  
    view_names: ['R-SHOE', 'L-SHOE', 'IMUBACK', 'RLA', 'RUA', 'LUA', 'LLA', 'RKN_', 'RKN^', 'HIP', 'RH', 'RWR', 'RUA_', 'RUA^', 'ACCELBACK', 'LUA_', 'LUA^', 'LWR', 'LH']

