output_dir_folder: /home/mena/results/co_missing/competitors
input_dir_folder: /misc/glm1/person/mena/pixel_data
additional_method_name: -SimMMDG

load_memory: True
data_name: cropharvest_multi


method: #fusion method
  feature: True
  simmmdg: True
  agg_args:
    mode: concat

training:
  max_epochs: 2
  batch_size: 128
  emb_dim: 128
  early_stop_args:
    min_delta: 0.01
    mode: min
    patience: 5
    verbose: True
  parallel_processes: 4 #this value will divide the total number of cpus to calcualte num_workers
  
  additional_args:
    split_features: True
  
    optimizer: adam
    lr: 0.0001

    weights_loss: 
      weighting: sum 
      main_pred: 1
      contrastive_temp: 0.1 #paper default
      contrastive_sup: 3 #paper default
      own_disentangle: 0.7 #paper default
      cross_translation: 0.1 #paper default
      
      missing_pred: 0
    
  missing_as_aug: False
  missing_method:
    name: ignore #reconstruct #inside is with reconstruction

experiment: 
  runs_seed: [10] #, 5, 5123] #repetitions
  kfolds: 10
  preprocess: 
    fillnan: False
    flatten: False
    form: zscore  
    view_names: ["S2_S2VI","S1","weather", "DEM"]

args_forward: #only for testing
  list_testing_views: [
    [ ["S2_S2VI"], [1.00] ] , #single-view prediction
    [ ["S1"], [1.00] ] , #single-view prediction
    [ ["weather"], [1.00] ] , #single-view prediction
    [ ["DEM"], [1.00] ] , #single-view prediction
    [ ["S2_S2VI", "weather", "DEM"], [1.0] ], #multi-view prediction
    [ ["S2_S2VI", "S1", "DEM"], [1.0] ], #multi-view prediction
    [ ["S2_S2VI", "S1", "weather"], [1.0] ], #multi-view prediction
    [ ["S1", "weather", "DEM"], [1.00] ], #only missing S2 in different rates
  ]
  
architecture:
  encoders: 
    S1:
      model_type: tempcnn
      dropout: 0.2
      kernel_size: 5
      layer_size: 128 
      n_layers: 2 
      seq_len: 12
      use_norm: True #actually in the paper the normalization is only inside cross tralsation loss
    S2_S2VI: 
      model_type: tempcnn
      dropout: 0.2
      kernel_size: 5 
      layer_size: 128 
      n_layers: 2 
      seq_len: 12
      use_norm: True #actually in the paper the normalization is only inside cross tralsation loss
    weather: 
      model_type: tempcnn
      dropout: 0.2
      kernel_size: 5 
      layer_size: 128 
      n_layers: 2 
      seq_len: 12
      use_norm: True #actually in the paper the normalization is only inside cross tralsation loss
    DEM: 
      model_type: mlp
      n_layers: 1
      layer_size: 128
      dropout: 0.2
      batchnorm: False
      use_norm: True #actually in the paper the normalization is only inside cross tralsation loss

  predictive_model:
    model_type: linear

    use_norm_last: False


  translator_args:
    layer_size: 2048 #paper default
    n_layers: 2
    dropout: 0.5
    use_norm: False
    batchnorm: False
