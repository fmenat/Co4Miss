input_dir_folder: /misc/glm1/person/mena/pixel_data
additional_method_name: -EmbrNet

load_memory: True
data_name: opport_LOC_train

training:
  max_epochs: 2
  batch_size: 256
  emb_dim: 128
  early_stop_args:
    min_delta: 0.01
    mode: min
    patience: 5
    verbose: True
  parallel_processes: 4 #1 #this value will divide the total number of cpus to calcualte num_workers
  
  additional_args:
    optimizer: adam
    lr: 0.001
  
  missing_as_aug: False
  missing_method:
    name: ignore
    
experiment: 
  runs_seed: [10] #, 5, 5123] #repetitions
  preprocess: 
    fillnan: True
    flatten: False
    form: zscore  
