output_dir_folder: /home/mena/results/co_missing/competitors
input_dir_folder: /misc/glm1/person/mena/pixel_data
additional_method_name: -MissModal

load_memory: True
data_name: cropharvest_multi


method: #fusion method
  feature: True
  missmodal: True
  agg_args: #this is actually a MLP
    mode: lstm
    num_layers: 2
    dropout: 0.4 
    
training:
  max_epochs: 2
  batch_size: 128
  emb_dim: 128
  early_stop_args:
    min_delta: 0.01
    mode: min
    patience: 5
    verbose: True
  parallel_processes: 4 #this value will divide the total number of cpus to calcualte num_workers
  
  additional_args:
    split_features: False
  
    optimizer: adam
    lr: 0.0001

    weights_loss: 
      weighting: sum 
      main_pred: 1
      missing_pred: 1 
      missing_distillation_feat: 1 #unknown from paper
      contrastive_geometric: 1 #unknown from paper

      contrastive_sup: 0
      own_disentangle: 0
      cross_translation: 0
      
  missing_as_aug: True
  missing_method:
    missing_random: True
    random_perc: 0.5

    name: impute
    where: feature
    value_fill: 0.0

experiment: 
  runs_seed: [10] #, 5, 5123] #repetitions
  kfolds: 10
  preprocess: 
    fillnan: False
    flatten: False
    form: zscore  
    view_names: ["S2_S2VI","S1","weather", "DEM"]

args_forward: #only for testing
  list_testing_views: [
    [ ["S2_S2VI"], [1.00] ] , #single-view prediction
    [ ["S1"], [1.00] ] , #single-view prediction
    [ ["weather"], [1.00] ] , #single-view prediction
    [ ["DEM"], [1.00] ] , #single-view prediction
    [ ["S2_S2VI", "weather", "DEM"], [1.0] ], #multi-view prediction
    [ ["S2_S2VI", "S1", "DEM"], [1.0] ], #multi-view prediction
    [ ["S2_S2VI", "S1", "weather"], [1.0] ], #multi-view prediction
    [ ["S1", "weather", "DEM"], [1.00] ], #only missing S2 in different rates
  ]
  
architecture:
  encoders: 
    S1:
      model_type: tempcnn
      dropout: 0.2
      kernel_size: 5 #default value: 5
      layer_size: 128 #default value: 128
      n_layers: 2 #default value: 3
      seq_len: 12
      use_norm: False
    S2_S2VI: 
      model_type: tempcnn
      dropout: 0.2
      kernel_size: 5 #default value: 5
      layer_size: 128 #default value: 128
      n_layers: 2 #default value: 3
      seq_len: 12
      use_norm: False
    weather: 
      model_type: tempcnn
      dropout: 0.2
      kernel_size: 5 #default value: 5
      layer_size: 128 #default value: 128
      n_layers: 2 #default value: 3
      seq_len: 12
      use_norm: False
    DEM: 
      model_type: mlp
      n_layers: 1
      layer_size: 128
      dropout: 0.2
      batchnorm: False
      use_norm: False

  predictive_model:
    model_type: linear

    use_norm_last: False