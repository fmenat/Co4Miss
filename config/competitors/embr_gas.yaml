output_dir_folder: /home/mena/results/co_missing/competitors
input_dir_folder: /misc/glm1/person/mena/pixel_data
additional_method_name: -EmbrNet

load_memory: True
data_name: gasarray_train

training:
  max_epochs: 2
  batch_size: 128
  emb_dim: 84
  early_stop_args:
    min_delta: 0.01
    mode: min
    patience: 5
    verbose: True
  parallel_processes: 4 #1 #this value will divide the total number of cpus to calcualte num_workers
  
  additional_args:
    optimizer: adam
    lr: 0.001
  
  missing_as_aug: False
  missing_method:
    name: ignore
    
experiment: 
  runs_seed: [10] #, 5, 5123] #repetitions
  preprocess: 
    fillnan: True
    flatten: False
    form: minmax-01  
    view_names: ['board1', 'board2', 'board3', 'board4', 'board5', 'board6', 'board7', 'board8', 'board9']

args_forward: #only for testing
  list_testing_views: [
    #single view predictions
    [ ['board1'], [1.00] ] ,
    [ ['board2'], [1.00] ] ,
    [ ['board3'], [1.00] ] ,
    [ ['board4'], [1.00] ] ,
    [ ['board5'], [1.00] ] ,
    [ ['board6'], [1.00] ] ,
    [ ['board7'], [1.00] ] ,
    [ ['board8'], [1.00] ] ,
    [ ['board9'], [1.00] ] ,
    #missing a single view
    [ ['board2', 'board3', 'board4', 'board5', 'board6', 'board7', 'board8', 'board9'], [1.00] ],
    [ ['board1', 'board3', 'board4', 'board5', 'board6', 'board7', 'board8', 'board9'], [1.00] ] ,
    [ ['board1', 'board2', 'board4', 'board5', 'board6', 'board7', 'board8', 'board9'], [1.00] ],
    [ ['board1', 'board2', 'board3', 'board5', 'board6', 'board7', 'board8', 'board9'], [1.00] ],
    [ ['board1', 'board2', 'board3', 'board4', 'board6', 'board7', 'board8', 'board9'], [1.00] ],
    [ ['board1', 'board2', 'board3', 'board4', 'board5', 'board7', 'board8', 'board9'], [1.00] ],
    [ ['board1', 'board2', 'board3', 'board4', 'board5', 'board6', 'board8', 'board9'], [1.00] ],
    [ ['board1', 'board2', 'board3', 'board4', 'board5', 'board6', 'board7', 'board9'], [1.00] ],
    [ ['board1', 'board2', 'board3', 'board4', 'board5', 'board6', 'board7', 'board8'], [1.00] ],
  ]
  
architecture:
  encoders: 
    -ALL:
      model_type: tempcnn
      dropout: 0.2
      kernel_size: 5 #default value: 5
      layer_size: 64 #default value: 128
      n_layers: 2 #default value: 3
      seq_len: 240
      use_norm: False
  predictive_model:
    model_type: linear


method: #fusion method
  feature: True
  agg_args:
    mode: sampling
    features: True