output_dir_folder: /home/mena/results/co_missing/competitors
input_dir_folder: /misc/glm1/person/mena/pixel_data
additional_method_name: -MissModal

load_memory: True
data_name: opport_MD_train


method: #fusion method
  feature: True
  missmodal: True
  agg_args: #this is actually a MLP
    mode: concat #lstm, concat, trans
    num_layers: 2
    dropout: 0.4 
    
training:
  max_epochs: 50
  batch_size: 100
  emb_dim: 128
  early_stop_args:
    min_delta: 0.01
    mode: min
    patience: 5
    verbose: True
  parallel_processes: 2 #this value will divide the total number of cpus to calcualte num_workers
  
  additional_args:
    split_features: False
  
    optimizer: adam
    lr: 0.0001

    weights_loss: 
      weighting: sum 
      main_pred: 1
      missing_pred: 1 
      missing_distillation_feat: 1 #unknown from paper
      contrastive_geometric: 1 #unknown from paper

      contrastive_sup: 0
      own_disentangle: 0
      cross_translation: 0
      
  missing_as_aug: True
  missing_method:
    missing_random: True
    random_perc: 0.5

    name: impute
    where: feature
    value_fill: 0.0

experiment: 
  runs_seed: [10, 5, 5123] #repetitions
  preprocess: 
    fillnan: True
    flatten: False
    form: zscore  
    view_names: ['R-SHOE', 'L-SHOE', 'IMUBACK', 'RLA', 'RUA', 'LUA', 'LLA', 'RKN_', 'RKN^', 'HIP', 'RH', 'RWR', 'RUA_', 'RUA^', 'ACCELBACK', 'LUA_', 'LUA^', 'LWR', 'LH']

